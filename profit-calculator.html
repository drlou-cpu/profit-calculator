<!DOCTYPE html>
<html>

<head>

<title>Profit Calculator</title>

<style>

body{
font-family:Arial;
background:#f4f6fb;
margin:0;
}

/* NAVBAR */
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:white;
box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.logo{
color:#16a34a;
font-weight:bold;
}

/* LINKS */
.nav a{
margin-left:20px;
text-decoration:none;
color:#333;
font-weight:bold;
}

/* HERO */
.hero{
text-align:center;
padding:40px;
}

.container{
background:white;
padding:25px;
border-radius:10px;
width:320px;
margin:20px auto;
}

input{
width:100%;
padding:10px;
margin:5px 0;
}

button{
width:100%;
padding:10px;
background:#22c55e;
color:white;
border:none;
margin-top:10px;
}

.result{
margin-top:10px;
font-weight:bold;
color:#16a34a;
}

</style>

</head>

<body>

<div class="nav">

<div class="logo">Ecommerce Tools</div>

<div>
<a href="./index.html">Home</a>
<a href="./index.html#tools">Tools</a>
<a href="./index.html#about">About</a>
</div>

</div>

<div class="hero">
<h1>Profit Calculator</h1>
</div>

<div class="container">

<input id="price" placeholder="e.g. 50">
<input id="cost" placeholder="e.g. 20">
<input id="shipping" placeholder="e.g. 5">
<input id="ads" placeholder="e.g. 10">
<input id="fee" placeholder="e.g. 3">

<button onclick="calc()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calc(){

var price=parseFloat(document.getElementById("price").value)||0;
var cost=parseFloat(document.getElementById("cost").value)||0;
var shipping=parseFloat(document.getElementById("shipping").value)||0;
var ads=parseFloat(document.getElementById("ads").value)||0;
var fee=parseFloat(document.getElementById("fee").value)||0;

var payment=price*(fee/100);
var profit=price-cost-shipping-ads-payment;

document.getElementById("result").innerHTML="Profit: $"+profit.toFixed(2);

}

</script>

</body>
</html>
