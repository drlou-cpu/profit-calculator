<!DOCTYPE html>
<html>

<head>

<title>Profit Calculator</title>

<style>

body{
font-family:Arial;
background:#f4f6fb;
text-align:center;
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:12px;
width:320px;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

label{
display:block;
text-align:left;
margin-top:10px;
font-weight:bold;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
}

button{
margin-top:15px;
width:100%;
padding:12px;
background:#22c55e;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.result{
margin-top:15px;
font-size:20px;
color:#16a34a;
font-weight:bold;
}

</style>

</head>

<body>

<h1>Ecommerce Profit Calculator</h1>

<div class="container">

<label>Selling price</label>
<input id="price" value="50" onblur="fixEmpty(this,50)">

<label>Product cost</label>
<input id="cost" value="20" onblur="fixEmpty(this,20)">

<label>Shipping cost</label>
<input id="shipping" value="5" onblur="fixEmpty(this,5)">

<label>Ad cost</label>
<input id="ads" value="10" onblur="fixEmpty(this,10)">

<label>Payment fee (%)</label>
<input id="fee" value="3" onblur="fixEmpty(this,3)">

<button onclick="calc()">Calculate Profit</button>

<div class="result" id="result"></div>

</div>

<script>

function fixEmpty(el, defaultVal){
if(el.value === ""){
el.value = defaultVal;
}
}

function calc(){

var price = parseFloat(document.getElementById("price").value) || 0;
var cost = parseFloat(document.getElementById("cost").value) || 0;
var shipping = parseFloat(document.getElementById("shipping").value) || 0;
var ads = parseFloat(document.getElementById("ads").value) || 0;
var fee = parseFloat(document.getElementById("fee").value) || 0;

var payment = price * (fee / 100);
var profit = price - cost - shipping - ads - payment;

document.getElementById("result").innerHTML =
"Profit: $" + profit.toFixed(2);

}

</script>

</body>
</html>
