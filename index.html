<title>Calculator Hub</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#e0f2fe,#f0fdf4);
color:#222;
overflow-x:hidden;
}

/* BACKGROUND SHAPES */
body::before,
body::after{
content:"";
position:absolute;
width:320px;
height:320px;
border-radius:50%;
filter:blur(90px);
opacity:0.18;
z-index:0;
}

body::before{
top:-120px;
left:-120px;
background:#3b82f6;
}

body::after{
bottom:-120px;
right:-120px;
background:#22c55e;
}

.nav{
display:flex;
align-items:center;
