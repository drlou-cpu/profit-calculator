<!DOCTYPE html>
<html>

<head>

<title>Ecommerce Tools</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#e0f2fe,#f0fdf4);
margin:0;
}

/* NAVBAR */
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 30px;
background:white;
box-shadow:0 6px 25px rgba(0,0,0,0.05);
}

/* LOGO */
.logo{
display:flex;
align-items:center;
gap:10px;
font-weight:bold;
font-size:18px;
}

/* HERO */
.hero{
text-align:center;
padding:60px 20px 40px;
}

.hero h1{
font-size:36px;
color:#16a34a;
}

/* GRID */
.tools{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
padding:20px;
max-width:900px;
margin:auto;
}

/* CARD */
.card{
background:white;
padding:25px;
border-radius:14px;
text-align:center;
text-decoration:none;
color:#333;
box-shadow:0 15px 40px rgba(0,0,0,0.08);
font-weight:bold;
transition:0.3s;
}

.card:hover{
background:#22c55e;
color:white;
transform:translateY(-5px);
}

/* MOBILE */
@media(max-width:768px){
.tools{
grid-template-columns:repeat(2,1fr);
}
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div class="nav">

<div class="logo">

<!-- SVG LOGO -->
<svg width="28" height="28" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10" fill="#facc15"/>
<path d="M12 2 A10 10 0 0 1 22 12" fill="#ef4444"/>
<path d="M12 22 A10 10 0 0 1 2 12" fill="#3b82f6"/>
</svg>

<span style="color:#3b82f6">omni</span>
<span style="color:#555">tools</span>

</div>

</div>

<!-- HERO -->
<div class="hero">
<h1>Free Ecommerce Calculators</h1>
<p>Smart tools to calculate profit, margins and ROAS</p>
</div>

<!-- TOOLS -->
<div class="tools">

<a href="profit-calculator.html" class="card">💰 Profit Calculator</a>
<a href="roas-calculator.html" class="card">📈 ROAS Calculator</a>
<a href="margin-calculator.html" class="card">📊 Margin Calculator</a>
<a href="break-even-calculator.html" class="card">⚖️ Break-even Calculator</a>
<a href="ad-budget-calculator.html" class="card">📢 Ad Budget Calculator</a>
<a href="markup-calculator.html" class="card">🏷️ Markup Calculator</a>

</div>

</body>
</html>
