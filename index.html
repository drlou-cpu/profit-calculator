<!DOCTYPE html>
<html>

<head>

<title>Calculator Hub</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
margin:0;
background:linear-gradient(135deg,#e0f2fe,#f0fdf4);
overflow-x:hidden;
}

/* BACKGROUND SHAPES */
body::before{
content:"";
position:absolute;
top:-120px;
left:-120px;
width:300px;
height:300px;
background:#3b82f6;
border-radius:50%;
opacity:0.15;
filter:blur(80px);
}

body::after{
content:"";
position:absolute;
bottom:-120px;
right:-120px;
width:300px;
height:300px;
background:#22c55e;
border-radius:50%;
opacity:0.15;
filter:blur(80px);
}

/* NAVBAR */
.nav{
display:flex;
align-items:center;
gap:10px;
padding:15px 20px;
background:white;
box-shadow:0 4px 20px rgba(0,0,0,0.05);
position:relative;
z-index:2;
}

/* LOGO */
.logo{
display:flex;
align-items:center;
gap:10px;
font-weight:bold;
font-size:18px;
}

/* CIRCLE LOGO */
.logo-circle{
width:28px;
height:28px;
border-radius:50%;
background:conic-gradient(red, yellow, blue, red);
}

/* TEXT LOGO */
.logo-text{
color:#2563eb;
}

/* HERO */
.hero{
text-align:center;
padding:50px 20px 20px;
position:relative;
z-index:2;
}

.hero h1{
color:#16a34a;
font-size:28px;
}

.hero p{
color:#666;
margin-top:10px;
font-size:14px;
}

/* GRID */
.tools{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
padding:20px;
max-width:900px;
margin:auto;
position:relative;
z-index:2;
}

/* CARD */
.card{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
text-decoration:none;
color:#333;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
transition:0.3s;
font-weight:bold;
font-size:14px;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 20px 50px rgba(0,0,0,0.15);
background:#22c55e;
color:white;
}

/* MOBILE */
@media(max-width:768px){

.hero h1{
font-size:22px;
}

.tools{
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:15px;
}

.card{
padding:15px;
font-size:13px;
}

}

/* SMALL MOBILE */
@media(max-width:480px){
.tools{
grid-template-columns:1fr;
}
}

/* CONTENT */
.content{
max-width:600px;
margin:40px auto;
padding:20px;
text-align:center;
color:#555;
font-size:14px;
position:relative;
z-index:2;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div class="nav">

<div class="logo">

<div class="logo-circle"></div>

<div class="logo-text">Calculator Hub</div>

</div>

</div>

<!-- HERO -->
<div class="hero">
<h1>Free Ecommerce Calculators</h1>
<p>Smart tools to calculate profit, margins and ROAS</p>
</div>

<!-- TOOLS -->
<div class="tools">

<a href="profit-calculator.html" class="card">💰 Profit Calculator</a>
<a href="roas-calculator.html" class="card">📈 ROAS Calculator</a>
<a href="margin-calculator.html" class="card">📊 Margin Calculator</a>
<a href="break-even-calculator.html" class="card">⚖️ Break-even Calculator</a>
<a href="ad-budget-calculator.html" class="card">📢 Ad Budget Calculator</a>
<a href="markup-calculator.html" class="card">🏷️ Markup Calculator</a>

</div>

<!-- CONTENT -->
<div class="content">
<p>
Simple ecommerce calculators to help you make better business decisions.
</p>
</div>

</body>
</html>
