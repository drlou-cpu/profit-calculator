<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Hub</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f7f9fc;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  padding: 15px 25px;
  background: white;
  border-bottom: 1px solid #eee;
}

.logo {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: conic-gradient(red, yellow, blue, red);
  margin-right: 10px;
}

.brand {
  font-size: 20px;
  font-weight: 600;
  color: #3a6df0;
}

/* HERO */
.hero {
  text-align: center;
  padding: 40px 20px;
}

.hero h1 {
  font-size: 32px;
}

.hero p {
  color: #666;
}

/* GRID */
.grid {
  max-width: 900px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 20px;
}

/* CARD */
.card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  cursor: pointer;
}

.card:hover {
  transform: translateY(-4px);
}

/* CALCULATOR AREA */
.calculator {
  max-width: 400px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  display: none;
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button {
  width: 100%;
  padding: 12px;
  background: #3a6df0;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.result {
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo"></div>
  <div class="brand">Calculator Hub</div>
</div>

<div class="hero" id="home">
  <h1>Your life in numbers</h1>
  <p>Simple calculators to make better decisions</p>
</div>

<div class="grid" id="tools">

  <div class="card" onclick="showCalculator()">
    💰
    <h3>Profit Calculator</h3>
    <p>Calculate your real earnings</p>
  </div>

</div>

<!-- CALCULATOR -->
<div class="calculator" id="profitCalc">
  <h3>Profit Calculator</h3>

  <input type="number" id="cost" placeholder="Product Cost">
  <input type="number" id="price" placeholder="Selling Price">

  <button onclick="calculateProfit()">Calculate</button>

  <div class="result" id="result"></div>
</div>

<script>
function showCalculator() {
  document.getElementById("tools").style.display = "none";
  document.getElementById("profitCalc").style.display = "block";
}

function calculateProfit() {
  let cost = document.getElementById("cost").value;
  let price = document.getElementById("price").value;

  let profit = price - cost;

  document.getElementById("result").innerText =
    "Profit: " + profit + "$";
}
</script>

</body>
</html>
