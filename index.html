<!DOCTYPE html>
<html>

<head>

<title>Ecommerce Tools</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
margin:0;
}

/* NAVBAR */
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:white;
box-shadow:0 4px 20px rgba(0,0,0,0.05);
}

.logo{
color:#16a34a;
font-weight:bold;
font-size:18px;
}

.nav a{
text-decoration:none;
margin-left:20px;
color:#333;
font-weight:bold;
}

/* HERO */
.hero{
text-align:center;
padding:60px 20px 40px;
}

.hero h1{
font-size:38px;
background:linear-gradient(135deg,#22c55e,#16a34a);
-webkit-background-clip:text;
color:transparent;
}

.hero p{
color:#666;
font-size:18px;
}

/* GRID */
.tools{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
padding:40px;
max-width:1000px;
margin:auto;
}

/* CARD */
.card{
background:white;
padding:30px 20px;
border-radius:14px;
text-align:center;
text-decoration:none;
color:#333;
box-shadow:0 15px 40px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:0 25px 50px rgba(0,0,0,0.15);
background:#22c55e;
color:white;
}

</style>

</head>

</div>

<!-- TOOLS -->
<div class="tools">

<a href="profit-calculator.html" class="card">

</a>

<a href="roas-calculator.html" class="card">

</a>

<a href="margin-calculator.html" class="card">
