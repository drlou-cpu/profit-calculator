<!DOCTYPE html>
<html>

<head>

<title>Ad Budget Calculator</title>

<meta name="description" content="Free advertising budget calculator for ecommerce campaigns.">

<style>

body{
font-family:Arial;
background:#f4f6fb;
display:flex;
flex-direction:column;
align-items:center;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
margin-top:60px;
text-align:center;
width:320px;
}

input{
padding:12px;
margin:8px 0;
width:100%;
border:1px solid #ddd;
border-radius:6px;
}

button{
padding:12px;
width:100%;
background:#3b73e0;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.result{
margin-top:15px;
font-size:20px;
font-weight:bold;
}

.content{
max-width:800px;
margin:60px auto;
padding:20px;
line-height:1.7;
}

</style>

</head>

<body>

<div class="container">

<h2>Ad Budget Calculator</h2>

<input id="cpa" placeholder="Cost per acquisition">

<input id="sales" placeholder="Target sales">

<button onclick="calc()">Calculate Budget</button>

<div class="result" id="result"></div>

</div>


<div class="content">

<h2>What is an advertising budget?</h2>

<p>
An advertising budget is the amount of money you plan to spend on marketing
to achieve a specific number of sales.
</p>

<h2>Formula</h2>

<p>
Ad budget = Cost per acquisition × Number of sales
</p>

</div>


<script>

function calc(){

var cpa=parseFloat(document.getElementById("cpa").value)||0;
var sales=parseFloat(document.getElementById("sales").value)||0;

var budget=cpa*sales;

document.getElementById("result").innerHTML="Ad budget needed: $"+budget.toFixed(2);

}

</script>

</body>
</html>
